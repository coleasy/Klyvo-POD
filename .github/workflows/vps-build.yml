name: Klyvo VPS build

on:
  push:
    branches:
      - architecture/vps-foundation
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: klyvo-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Build standalone application
        run: bun run build

      - name: Package production artifact
        run: |
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          if [ -d public ]; then cp -a public release/public; fi
          tar -C release -czf klyvo-${GITHUB_SHA}.tar.gz .

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: klyvo-${{ github.sha }}
          path: klyvo-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
