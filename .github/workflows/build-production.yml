name: Build production artifact

on:
  push:
    branches: [main, architecture/lightweight-vps-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klyvo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Production build
        run: bun run build

      - name: Package standalone release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          if [ -d public ]; then cp -a public release/public; fi
          printf '{"commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/_deployment.json
          tar -czf "klyvo-${GITHUB_SHA}.tar.gz" -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klyvo-${{ github.sha }}
          path: klyvo-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
